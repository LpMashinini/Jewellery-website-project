name: Backend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: Backend-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read


jobs:

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15


    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Wait for MySQL
        run: |
          until mysqladmin ping \
            -h 127.0.0.1 \
            -u "${{ secrets.MYSQL_USERNAME }}" \
            --password="${{ secrets.MYSQL_ROOT_PASSWORD }}" \
            --silent; do
            echo "Waiting for MySQL"
            sleep 5
          done

      - name: Run Tests
        working-directory: ./Backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/${{ secrets.MYSQL_DATABASE }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.MYSQL_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}

        run: mvn -B clean verify

  build:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: mvn -B clean package -DskipTests
        working-directory: ./Backend


      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: Backend/target/*.jar



  docker:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15


    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Jar
        uses: actions/download-artifact@v4
        with:
          name: app.jar
          path: Backend/target

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: false
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/jewellery-website-project:latest
            ${{ secrets.DOCKER_PASSWORD }}/jewellery-website-project:${{ github.sha }}
          load: true


      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/jewellery-website-project:${{ github.sha }}
          severity: CRITICAL, HIGH
          exit-code: 1

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/jewellery-website-project:${{ github.sha }}
          docker push ${{ secrets.DOCKER_PASSWORD }}/jewellery-website-project:latest
